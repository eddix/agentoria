[package]
name = "sessionary-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native GPUI preview for Sessionary"

[[bin]]
name = "sessionary-gpui-preview"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-channel = "2"
dirs = "6"
# Keep this source identical to gpui-component's workspace dependency so Cargo
# resolves one GPUI type graph. Cargo.lock pins it to the reviewed revision.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "6d07863fe7077f85abfa0ec2fcb05f3e17c573b2" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "6d07863fe7077f85abfa0ec2fcb05f3e17c573b2" }
notify = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sessionary-core = { path = "../sessionary-core" }
smol = "2"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
tempfile = "3"
