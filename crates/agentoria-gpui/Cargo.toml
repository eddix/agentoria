[package]
name = "agentoria-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native GPUI app for Agentoria"

[[bin]]
name = "agentoria-preview"
path = "src/main.rs"
required-features = ["preview"]

[[bin]]
name = "agentoria"
path = "src/formal.rs"
required-features = ["formal"]

[features]
default = ["preview"]
preview = []
formal = []

[dependencies]
anyhow = "1"
async-channel = "2"
dirs = "6"
gpui-kit = { version = "0.7.1", features = ["tree-sitter-bash", "tree-sitter-go", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-ruby", "tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx"] }
notify = "7"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
agentoria-core = { path = "../agentoria-core" }
rusqlite = { version = "0.32.1", features = ["backup"] }
smol = "2"
toml = "0.9.12"
url = "2"

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }
tempfile = "3"
