name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" crates/agentoria-gpui/Info.formal.plist
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" crates/agentoria-gpui/Info.formal.plist
      - name: Build and sign app
        run: ./build_gpui_formal.sh --no-open
      - name: Package app
        shell: bash
        run: |
          archive="Agentoria-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$HOME/Applications/Agentoria.app" "$archive"
          unzip -t "$archive"
          shasum -a 256 "$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: Agentoria-${{ matrix.arch }}
          path: Agentoria-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Agentoria-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --generate-notes
