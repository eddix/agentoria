[package]
name = "sessionary"
version = "0.1.0"
description = "A local session reader for Claude and Codex"
authors = ["bytedance"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
walkdir = "2"

[features]
default = []
