[package]
name = "sessionary"
version = "0.1.0"
description = "A local session reader for Claude and Codex"
authors = ["bytedance"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sessionary-core = { path = "../crates/sessionary-core" }
tauri = { version = "2", features = ["devtools"] }

[features]
default = []
# Enabled by `tauri build` automatically; must be passed explicitly to `cargo build --release`
# or tauri-build emits `cfg(dev)` and the webview loads the devUrl instead of embedded assets.
custom-protocol = ["tauri/custom-protocol"]
